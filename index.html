<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ING Bank - EcoWallet</title>
    <!-- Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [view, setView] = useState('bank'); // 'bank', 'ecowallet', 'premium_checkout'
            const [walletBalance, setWalletBalance] = useState(14.50);
            const [badges, setBadges] = useState([]);
            const [isPremium, setIsPremium] = useState(false);
            const [activeTab, setActiveTab] = useState('wallet'); // 'wallet', 'causes', 'album'
            const [customDonateAmount, setCustomDonateAmount] = useState('');

            const causes = [
                { id: 1, name: "Reforestation Project", desc: "Plant trees in deforested areas." },
                { id: 2, name: "Ocean Cleanup", desc: "Remove plastics from the ocean." },
                { id: 3, name: "Green Energy Fund", desc: "Support solar and wind energy." },
                { id: 4, name: "Wildlife Conservation", desc: "Protect endangered species." },
                { id: 5, name: "Local Recycling", desc: "Improve city recycling facilities." },
                { id: 6, name: "Clean Water Initiative", desc: "Provide clean water to communities." },
                { id: 7, name: "Sustainable Agriculture", desc: "Support eco-friendly farming." },
                { id: 8, name: "Coral Reef Restoration", desc: "Rebuild dying coral reefs." }
            ];

            const handleDonateAll = (causeId) => {
                if (walletBalance <= 0) {
                    alert("Your wallet is empty!");
                    return;
                }
                alert(`Donated €${walletBalance.toFixed(2)} to cause #${causeId}!`);
                const badgesEarned = isPremium ? 2 : 1;
                const newBadges = Array(badgesEarned).fill(causeId);
                setBadges([...badges, ...newBadges]);
                setWalletBalance(0);
            };

            const handleCustomDonate = () => {
                const amount = parseFloat(customDonateAmount);
                if (isNaN(amount) || amount <= 0) {
                    alert("Please enter a valid amount.");
                    return;
                }
                alert(`Thank you for adding €${amount.toFixed(2)} to your EcoWallet!`);
                setWalletBalance(walletBalance + amount);
                setCustomDonateAmount('');
            };

            // Calculate Reward Unlocks
            const hasThreeSame = causes.some(c => badges.filter(b => b === c.id).length >= 3);
            const uniqueBadgesCount = new Set(badges).size;
            const hasCompletedAlbum = uniqueBadgesCount === causes.length;
            const totalBadges = badges.length;

            const rewards = [
                { id: 'r1', title: 'Sustainability Diploma', desc: 'Donate 3 times to a single cause', unlocked: hasThreeSame, icon: '📜' },
                { id: 'r2', title: '15% Partner Discount', desc: 'Collect 5 total badges', unlocked: totalBadges >= 5, icon: '🏷️' },
                { id: 'r3', title: '3 Months Free Premium', desc: 'Complete the entire badge album', unlocked: hasCompletedAlbum, icon: '✨' }
            ];

            if (view === 'bank') {
                return (
                    <div className="min-h-screen bg-orange-500 flex flex-col items-center pt-12">
                        <h1 className="text-4xl font-bold text-white mb-8">ING</h1>
                        <div className="bg-white p-6 rounded-lg shadow-lg w-11/12 max-w-md">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-bold">Good morning, JK</h2>
                                <div className="w-10 h-10 bg-gray-200 text-gray-700 rounded-full flex items-center justify-center font-bold">JK</div>
                            </div>
                            <div className="mb-6 p-4 bg-gray-50 rounded-lg">
                                <p className="text-gray-500 text-sm">Main Account</p>
                                <p className="text-2xl font-bold">€ 2,450.00</p>
                            </div>
                            <button 
                                onClick={() => setView('ecowallet')}
                                className="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition flex justify-between items-center px-4 shadow">
                                <span>🌱 EcoWallet Rewards</span>
                                <span>€ {walletBalance.toFixed(2)} &rarr;</span>
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'premium_checkout') {
                return (
                    <div className="min-h-screen bg-gray-100 flex flex-col items-center pt-12">
                        <div className="bg-white p-6 rounded-lg shadow-lg w-11/12 max-w-md">
                            <h2 className="text-2xl font-bold mb-4 text-gray-800">EcoWallet Premium</h2>
                            <p className="mb-6 text-gray-600">Double your impact! Get 2x badges for every donation. Cancel anytime.</p>
                            <div className="text-4xl font-bold mb-6 text-center text-blue-600">€ 4.00 <span className="text-sm text-gray-500 font-normal">/ month</span></div>
                            <button 
                                onClick={() => {
                                    setIsPremium(true);
                                    setView('ecowallet');
                                    alert("Premium Activated!");
                                }}
                                className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition mb-3 shadow">
                                Pay €4.00 to Subscribe
                            </button>
                            <button 
                                onClick={() => setView('ecowallet')}
                                className="w-full bg-gray-200 text-gray-800 py-3 rounded-lg font-bold hover:bg-gray-300 transition">
                                Cancel
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col max-w-md mx-auto shadow-2xl overflow-hidden relative">
                    {/* Header */}
                    <div className="bg-green-600 text-white p-4 flex justify-between items-center shadow">
                        <button onClick={() => setView('bank')} className="text-sm font-medium hover:underline opacity-90">&larr; Back to ING</button>
                        <h1 className="font-bold text-lg">EcoWallet</h1>
                        <div className="w-8 h-8 bg-white text-green-700 rounded-full flex items-center justify-center font-bold text-sm shadow">JK</div>
                    </div>

                    {/* Content */}
                    <div className="flex-1 overflow-y-auto p-4 pb-24">
                        {activeTab === 'wallet' && (
                            <div>
                                <div className="bg-white p-6 rounded-xl shadow mb-6 text-center border-t-4 border-green-500">
                                    <p className="text-gray-500 mb-2 font-medium">Spare Change & Funds</p>
                                    <h2 className="text-5xl font-bold text-gray-800 mb-6">€ {walletBalance.toFixed(2)}</h2>
                                    
                                    <div className="mt-6 border-t pt-4">
                                        <p className="text-sm font-semibold mb-3 text-gray-600">Add Voluntary Funds:</p>
                                        <div className="flex gap-2 justify-center mb-4">
                                            <button onClick={() => {setWalletBalance(walletBalance + 2); alert("Added €2!");}} className="flex-1 bg-green-50 text-green-700 font-bold px-3 py-2 rounded-lg border border-green-200 hover:bg-green-100 transition">+ €2</button>
                                            <button onClick={() => {setWalletBalance(walletBalance + 5); alert("Added €5!");}} className="flex-1 bg-green-50 text-green-700 font-bold px-3 py-2 rounded-lg border border-green-200 hover:bg-green-100 transition">+ €5</button>
                                            <button onClick={() => {setWalletBalance(walletBalance + 10); alert("Added €10!");}} className="flex-1 bg-green-50 text-green-700 font-bold px-3 py-2 rounded-lg border border-green-200 hover:bg-green-100 transition">+ €10</button>
                                        </div>
                                        <div className="flex gap-2">
                                            <input 
                                                type="number" 
                                                value={customDonateAmount}
                                                onChange={(e) => setCustomDonateAmount(e.target.value)}
                                                placeholder="Custom amount (€)" 
                                                className="border p-2 rounded-lg w-full bg-gray-50 focus:ring-2 focus:ring-green-500 outline-none"
                                            />
                                            <button onClick={handleCustomDonate} className="bg-green-600 text-white font-bold px-5 py-2 rounded-lg hover:bg-green-700 transition">Add</button>
                                        </div>
                                    </div>
                                </div>
                                
                                {!isPremium && (
                                    <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-5 rounded-xl text-white shadow-lg flex justify-between items-center cursor-pointer hover:shadow-xl transition" onClick={() => setView('premium_checkout')}>
                                        <div>
                                            <h3 className="font-bold text-lg">Upgrade to Premium</h3>
                                            <p className="text-sm opacity-90 mt-1">Get 2x badges per donation!</p>
                                        </div>
                                        <div className="bg-white text-blue-700 px-4 py-2 rounded-full text-sm font-bold shadow">€4/mo</div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'causes' && (
                            <div>
                                <h2 className="text-xl font-bold mb-2 text-gray-800">Support a Cause</h2>
                                <p className="text-sm text-gray-600 mb-6">Transfer your wallet balance (<strong>€{walletBalance.toFixed(2)}</strong>) to make a real impact.</p>
                                <div className="space-y-4">
                                    {causes.map(cause => (
                                        <div key={cause.id} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                                            <h3 className="font-bold text-lg text-gray-800">{cause.name}</h3>
                                            <p className="text-gray-500 text-sm mb-4 mt-1">{cause.desc}</p>
                                            <button 
                                                onClick={() => handleDonateAll(cause.id)}
                                                className={`w-full py-3 rounded-lg font-bold transition ${walletBalance > 0 ? 'bg-green-600 text-white hover:bg-green-700 shadow-md' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>
                                                Donate €{walletBalance.toFixed(2)}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'album' && (
                            <div>
                                <h2 className="text-xl font-bold mb-2 text-gray-800">Your Badge Album</h2>
                                <p className="text-sm text-gray-600 mb-4">You have collected {badges.length} badges.</p>
                                <div className="grid grid-cols-2 gap-4 mb-8">
                                    {causes.map(cause => {
                                        const count = badges.filter(b => b === cause.id).length;
                                        return (
                                            <div key={cause.id} className={`aspect-square rounded-xl flex flex-col items-center justify-center p-3 text-center shadow-sm transition ${count > 0 ? 'bg-green-50 border-2 border-green-500' : 'bg-white border border-gray-100 opacity-60'}`}>
                                                <div className="text-4xl mb-2">{count > 0 ? '🏆' : '🔒'}</div>
                                                <div className="text-sm font-bold text-gray-700 leading-tight mb-2">{cause.name}</div>
                                                {count > 0 && <div className="text-xs bg-green-500 text-white px-3 py-1 rounded-full font-bold shadow-sm">x{count} collected</div>}
                                            </div>
                                        );
                                    })}
                                </div>

                                <h2 className="text-xl font-bold mb-2 text-gray-800">Unlockable Rewards</h2>
                                <p className="text-sm text-gray-600 mb-4">Complete milestones to earn real-world rewards.</p>
                                <div className="space-y-3">
                                    {rewards.map(reward => (
                                        <div key={reward.id} className={`flex items-center p-4 rounded-xl shadow-sm border ${reward.unlocked ? 'bg-green-50 border-green-200' : 'bg-white border-gray-100 opacity-70'}`}>
                                            <div className="text-3xl mr-4">{reward.icon}</div>
                                            <div className="flex-1">
                                                <h3 className={`font-bold ${reward.unlocked ? 'text-green-800' : 'text-gray-700'}`}>{reward.title}</h3>
                                                <p className="text-xs text-gray-500">{reward.desc}</p>
                                            </div>
                                            <div>
                                                {reward.unlocked ? (
                                                    <span className="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-full">Unlocked!</span>
                                                ) : (
                                                    <span className="bg-gray-200 text-gray-500 text-xs font-bold px-2 py-1 rounded-full">Locked</span>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Tab Bar */}
                    <div className="absolute bottom-0 w-full bg-white border-t flex justify-around p-2 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <button onClick={() => setActiveTab('wallet')} className={`flex flex-col items-center p-3 flex-1 ${activeTab === 'wallet' ? 'text-green-600' : 'text-gray-400 hover:text-gray-600'}`}>
                            <span className="text-2xl mb-1">💰</span>
                            <span className="text-xs font-bold">Wallet</span>
                        </button>
                        <button onClick={() => setActiveTab('causes')} className={`flex flex-col items-center p-3 flex-1 ${activeTab === 'causes' ? 'text-green-600' : 'text-gray-400 hover:text-gray-600'}`}>
                            <span className="text-2xl mb-1">🌍</span>
                            <span className="text-xs font-bold">Causes</span>
                        </button>
                        <button onClick={() => setActiveTab('album')} className={`flex flex-col items-center p-3 flex-1 ${activeTab === 'album' ? 'text-green-600' : 'text-gray-400 hover:text-gray-600'}`}>
                            <span className="text-2xl mb-1">🏅</span>
                            <span className="text-xs font-bold">Album</span>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
